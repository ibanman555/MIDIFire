<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <rect width="1920" height="960" fill="#07111f"/>
  <text x="120" y="155" fill="#fff" font-family="Arial, sans-serif" font-size="78" font-weight="800">Every essential MIDI message</text>
  <text x="124" y="225" fill="#9db0c4" font-family="Arial, sans-serif" font-size="34">Configure one Stream Deck action for the message you need.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(120 320)">
      <rect width="510" height="430" rx="34" fill="#10263e" stroke="#214d70" stroke-width="3"/>
      <rect x="2" y="2" width="506" height="12" rx="6" fill="#16a34a"/>
      <text x="255" y="98" text-anchor="middle" fill="#fff" font-size="44" font-weight="700">Note</text>
      <text x="255" y="180" text-anchor="middle" fill="#7ee787" font-family="Consolas, monospace" font-size="36" font-weight="700">90 3C 7F</text>
      <text x="255" y="252" text-anchor="middle" fill="#c7d5e4" font-size="29">Channel 1 · Middle C</text>
      <text x="255" y="298" text-anchor="middle" fill="#c7d5e4" font-size="29">Velocity 127</text>
      <line x1="92" y1="335" x2="418" y2="335" stroke="#214d70" stroke-width="2"/>
      <text x="255" y="382" text-anchor="middle" fill="#fff" font-size="25">Note Off on release</text>
    </g>
    <g transform="translate(705 320)">
      <rect width="510" height="430" rx="34" fill="#10263e" stroke="#214d70" stroke-width="3"/>
      <rect x="2" y="2" width="506" height="12" rx="6" fill="#16a34a"/>
      <text x="255" y="98" text-anchor="middle" fill="#fff" font-size="41" font-weight="700">Control Change</text>
      <text x="255" y="180" text-anchor="middle" fill="#7ee787" font-family="Consolas, monospace" font-size="36" font-weight="700">B0 07 64</text>
      <text x="255" y="252" text-anchor="middle" fill="#c7d5e4" font-size="29">Channel 1 · CC 7</text>
      <text x="255" y="298" text-anchor="middle" fill="#c7d5e4" font-size="29">Value 100</text>
      <line x1="92" y1="335" x2="418" y2="335" stroke="#214d70" stroke-width="2"/>
      <text x="255" y="382" text-anchor="middle" fill="#fff" font-size="25">Zero on release</text>
    </g>
    <g transform="translate(1290 320)">
      <rect width="510" height="430" rx="34" fill="#10263e" stroke="#214d70" stroke-width="3"/>
      <rect x="2" y="2" width="506" height="12" rx="6" fill="#16a34a"/>
      <text x="255" y="98" text-anchor="middle" fill="#fff" font-size="41" font-weight="700">Program Change</text>
      <text x="255" y="180" text-anchor="middle" fill="#7ee787" font-family="Consolas, monospace" font-size="36" font-weight="700">C0 0A</text>
      <text x="255" y="252" text-anchor="middle" fill="#c7d5e4" font-size="29">Channel 1</text>
      <text x="255" y="298" text-anchor="middle" fill="#c7d5e4" font-size="29">Program 10</text>
      <line x1="92" y1="335" x2="418" y2="335" stroke="#214d70" stroke-width="2"/>
      <text x="255" y="382" text-anchor="middle" fill="#fff" font-size="25">Recall sounds instantly</text>
    </g>
  </g>
