<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960">
  <rect width="1920" height="960" fill="#07111f"/>
  <text x="120" y="155" fill="#fff" font-family="Arial, sans-serif" font-size="68" font-weight="800">Reliable Windows MIDI workflows</text>
  <text x="124" y="225" fill="#9db0c4" font-family="Arial, sans-serif" font-size="34">Choose a physical or virtual output, then see whether the message worked.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(120 340)"><rect width="500" height="390" rx="34" fill="#10263e" stroke="#214d70" stroke-width="3"/><rect x="2" y="2" width="496" height="12" rx="6" fill="#16a34a"/><text x="250" y="135" text-anchor="middle" fill="#7ee787" font-size="64" font-weight="800">01</text><text x="250" y="235" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">Select an output</text><text x="250" y="295" text-anchor="middle" fill="#aebfd0" font-size="27">Physical or virtual MIDI</text></g>
    <g transform="translate(710 340)"><rect width="500" height="390" rx="34" fill="#10263e" stroke="#214d70" stroke-width="3"/><rect x="2" y="2" width="496" height="12" rx="6" fill="#16a34a"/><text x="250" y="135" text-anchor="middle" fill="#7ee787" font-size="64" font-weight="800">02</text><text x="250" y="235" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">Press the key</text><text x="250" y="295" text-anchor="middle" fill="#aebfd0" font-size="27">Messages send immediately</text></g>
    <g transform="translate(1300 340)"><rect width="500" height="390" rx="34" fill="#10263e" stroke="#214d70" stroke-width="3"/><rect x="2" y="2" width="496" height="12" rx="6" fill="#16a34a"/><text x="250" y="135" text-anchor="middle" fill="#7ee787" font-size="52" font-weight="800">✓ / <tspan fill="#f87171">×</tspan></text><text x="250" y="235" text-anchor="middle" fill="#fff" font-size="38" font-weight="700">Get feedback</text><text x="250" y="295" text-anchor="middle" fill="#aebfd0" font-size="27">Success and error alerts</text></g>
  </g>
  <text x="960" y="835" text-anchor="middle" fill="#7ee787" font-family="Arial, sans-serif" font-size="32" font-weight="700">Works with Bome virtual MIDI ports</text>
</svg>
